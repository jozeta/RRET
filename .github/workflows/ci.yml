name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Lint (ESLint, including the unsafe-DOM rule)
        run: npm run lint
      - name: Syntax check
        run: npm run check
      - name: Unit tests (maths, scenario rules, storage, import, data, PWA)
        run: npm test
      - name: Browser smoke tests
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" npm run test:browser
